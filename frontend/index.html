<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataVault Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        header { background-color: #2c3e50; color: white; padding: 1rem; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .upload-section { text-align: center; padding: 40px; border: 2px dashed #ccc; border-radius: 8px; cursor: pointer; }
        .upload-section:hover { border-color: #3498db; background-color: #f0f8ff; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #ecf0f1; }
        .category-tag { padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; color: white; }
        .cat-Document { background-color: #3498db; }
        .cat-Table { background-color: #2ecc71; }
        .cat-Code { background-color: #e67e22; }
        .cat-Image { background-color: #9b59b6; }
        .cat-Video { background-color: #e74c3c; }
        .cat-Other { background-color: #95a5a6; }
        .action-btn { margin-right: 5px; padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-download { background-color: #3498db; }
        .btn-delete { background-color: #e74c3c; }
        .btn-preview { background-color: #9b59b6; }
        .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .search-input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; flex-grow: 1; }

        /* Modal styles */
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
        .modal-content { background-color: #fefefe; margin: 10% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 800px; border-radius: 8px; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover, .close:focus { color: black; text-decoration: none; cursor: pointer; }
        .preview-content { margin-top: 20px; text-align: center; min-height: 200px; display: flex; justify-content: center; align-items: center; }
        .preview-content img, .preview-content video { max-width: 100%; max-height: 600px; }
        .preview-content pre { text-align: left; background: #f4f4f9; padding: 10px; width: 100%; overflow-x: auto; }

        .tag { background: #eee; padding: 2px 6px; border-radius: 10px; font-size: 0.8em; margin-right: 4px; display: inline-block; }
        .tag-add { cursor: pointer; color: #3498db; font-weight: bold; }
    </style>
</head>
<body>
    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">File Preview</h2>
            <div id="preview-container" class="preview-content"></div>
        </div>
    </div>
    <header>
        <h1>DataVault Dashboard</h1>
    </header>
    <div class="container">
        <div class="dashboard-grid">
            <div class="card">
                <h2>Upload Files</h2>
                <div class="upload-section" id="drop-zone">
                    <p>Drag & Drop files here or click to select</p>
                    <input type="file" id="file-input" multiple style="display: none;">
                </div>
                <div id="upload-status" style="margin-top: 10px;"></div>
            </div>
            <div class="card">
                <h2>Storage Trends</h2>
                <canvas id="statsChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>File Library</h2>
            <div class="controls">
                <input type="text" id="search-input" class="search-input" placeholder="Search files..." oninput="debounceLoadFiles()">
                <select id="sort-select" onchange="loadFiles()">
                    <option value="date">Sort by Date</option>
                    <option value="size">Sort by Size</option>
                </select>
                <select id="order-select" onchange="loadFiles()">
                    <option value="desc">Descending</option>
                    <option value="asc">Ascending</option>
                </select>
            </div>
            <div style="margin-bottom: 10px;">
                <button onclick="filterCategory('')">All</button>
                <button onclick="filterCategory('Document')">Documents</button>
                <button onclick="filterCategory('Table')">Tables</button>
                <button onclick="filterCategory('Code')">Code</button>
                <button onclick="filterCategory('Image')">Images</button>
                <button onclick="filterCategory('Video')">Videos</button>
            </div>
            <table id="files-table">
                <thead>
                    <tr>
                        <th>Filename</th>
                        <th>Category</th>
                        <th>Tags</th>
                        <th>Size (KB)</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const statusDiv = document.getElementById('upload-status');
        let statsChart = null;
        let currentCategory = '';
        let debounceTimer;

        // Drag & Drop handlers
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#3498db'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#ccc'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ccc';
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', () => handleFiles(fileInput.files));

        async function handleFiles(files) {
            statusDiv.textContent = `Uploading ${files.length} files...`;
            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);
                try {
                    const res = await fetch('/upload/', { method: 'POST', body: formData });
                    if (!res.ok) throw new Error('Upload failed');
                } catch (err) {
                    console.error(err);
                    statusDiv.textContent = 'Error uploading one or more files.';
                }
            }
            statusDiv.textContent = 'Upload complete!';
            loadStats();
            loadFiles();
            setTimeout(() => statusDiv.textContent = '', 3000);
        }

        async function loadStats() {
            const res = await fetch('/stats');
            const data = await res.json();

            const ctx = document.getElementById('statsChart').getContext('2d');
            const labels = Object.keys(data.category_counts);
            const values = Object.values(data.category_counts);

            if (statsChart) statsChart.destroy();

            statsChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: ['#3498db', '#2ecc71', '#e67e22', '#9b59b6', '#e74c3c', '#95a5a6']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function filterCategory(category) {
            currentCategory = category;
            loadFiles();
        }

        function debounceLoadFiles() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(loadFiles, 300);
        }

        async function loadFiles() {
            const search = document.getElementById('search-input').value;
            const sortBy = document.getElementById('sort-select').value;
            const order = document.getElementById('order-select').value;

            const params = new URLSearchParams({
                sort_by: sortBy,
                order: order
            });

            if (currentCategory) params.append('category', currentCategory);
            if (search) params.append('search', search);

            const res = await fetch(`/files?${params.toString()}`);
            const files = await res.json();

            const tbody = document.querySelector('#files-table tbody');
            tbody.innerHTML = '';

            files.forEach(file => {
                const tr = document.createElement('tr');
                const date = new Date(file.upload_date).toLocaleDateString();
                const sizeKB = (file.size / 1024).toFixed(2);

                let tagsHtml = file.tags ? file.tags.split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('') : '';
                tagsHtml += ` <span class="tag-add" onclick="editTags(${file.id}, '${file.tags || ''}')">+</span>`;

                tr.innerHTML = `
                    <td>${file.filename}</td>
                    <td><span class="category-tag cat-${file.category}">${file.category}</span></td>
                    <td>${tagsHtml}</td>
                    <td>${sizeKB}</td>
                    <td>${date}</td>
                    <td>
                        <button class="action-btn btn-preview" onclick="previewFile(${file.id}, '${file.category}', '${file.filename}')">👁</button>
                        <button class="action-btn btn-download" onclick="downloadFile(${file.id})">⬇</button>
                        <button class="action-btn btn-delete" onclick="deleteFile(${file.id})">🗑</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function downloadFile(id) {
            window.location.href = `/download/${id}`;
        }

        async function deleteFile(id) {
            if (!confirm('Are you sure you want to delete this file?')) return;

            try {
                const res = await fetch(`/files/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadStats();
                    loadFiles();
                } else {
                    alert('Failed to delete file');
                }
            } catch (err) {
                console.error(err);
                alert('Error deleting file');
            }
        }

        async function editTags(id, currentTags) {
            const newTags = prompt("Enter tags (comma separated):", currentTags);
            if (newTags !== null) {
                try {
                    const res = await fetch(`/files/${id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tags: newTags })
                    });
                    if (res.ok) loadFiles();
                } catch (err) {
                    console.error(err);
                }
            }
        }

        function closeModal() {
            document.getElementById('preview-modal').style.display = "none";
            document.getElementById('preview-container').innerHTML = "";
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            if (event.target == document.getElementById('preview-modal')) {
                closeModal();
            }
        }

        async function previewFile(id, category, filename) {
            const modal = document.getElementById('preview-modal');
            const container = document.getElementById('preview-container');
            document.getElementById('modal-title').innerText = `Preview: ${filename}`;
            modal.style.display = "block";
            container.innerHTML = "Loading...";

            const url = `/download/${id}`;

            if (category === 'Image') {
                container.innerHTML = `<img src="${url}" alt="Preview">`;
            } else if (category === 'Video') {
                container.innerHTML = `<video controls><source src="${url}"></video>`;
            } else if (category === 'Code' || category === 'Document' || category === 'Table') {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        const text = await res.text();
                        // Simple truncation for large files
                        const displayContent = text.length > 10000 ? text.substring(0, 10000) + "\n... (truncated)" : text;
                        // Escape HTML
                        const escaped = displayContent.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        container.innerHTML = `<pre>${escaped}</pre>`;
                    } else {
                        container.innerHTML = "Failed to load content.";
                    }
                } catch (e) {
                    container.innerHTML = "Error loading preview.";
                }
            } else {
                container.innerHTML = `<p>Preview not available for this file type. <a href="${url}">Download</a> to view.</p>`;
            }
        }

        // Initial load
        loadStats();
        loadFiles();
    </script>
</body>
</html>
